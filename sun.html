<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sol y Luna</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2a1a00 0%, #000 100%);
      overflow: hidden;
      transition: background 1s ease;
      position: relative;
    }

    /* Video centrado */
    video {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      object-fit: cover;
      transition: opacity 1s ease, box-shadow 1s ease;
      cursor: pointer;
      z-index: 2;
      box-shadow: 0 0 100px rgba(255, 180, 60, 0.6);
    }

    /* Fondo animado para las estrellas */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1.5s ease;
      z-index: 1;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Modo Luna */
    body.luna {
      background: radial-gradient(circle at center, #0b1940 0%, #000 100%);
    }
    body.luna .stars {
      opacity: 1;
    }
    body.luna video {
      box-shadow: 0 0 80px rgba(150, 180, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <video id="astro" src="sol.mp4" autoplay loop muted></video>

  <script>
    const astro = document.getElementById('astro');
    const starsContainer = document.getElementById('stars');
    let esSol = true;

    // Crear estrellas
    function crearEstrellas(num = 100) {
      starsContainer.innerHTML = '';
      for (let i = 0; i < num; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        star.style.top = `${Math.random() * 100}%`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.animationDelay = `${Math.random() * 3}s`;
        starsContainer.appendChild(star);
      }
    }
    crearEstrellas();

    // Cambiar entre Sol y Luna
    astro.addEventListener('click', () => {
      astro.style.opacity = 0;

      setTimeout(() => {
        if (esSol) {
          astro.src = 'luna.mp4';
          document.body.classList.add('luna');
        } else {
          astro.src = 'sol.mp4';
          document.body.classList.remove('luna');
        }
        esSol = !esSol;
        astro.load();
        astro.play();
        astro.style.opacity = 1;
      }, 700);
    });
  </script>
</body>
</html>
